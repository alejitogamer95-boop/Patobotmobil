name: Compilar APK de Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Java JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Limpiar y actualizar paquetes APT
      run: |
        sudo rm -rf /var/lib/apt/lists/*
        sudo apt-get update -y --fix-missing
        sudo apt-get install -y --no-install-recommends \
          git zip unzip openjdk-17-jdk python3-pip autoconf libtool \
          pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
          libtinfo5 cmake libffi-dev libssl-dev build-essential

    - name: Instalar Buildozer y Cython
      run: |
        python3 -m pip install --upgrade pip setuptools
        python3 -m pip install buildozer cython

    - name: Compilar APK con Buildozer
      run: |
        buildozer android debug

    - name: Subir APK como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: TikTokBot-APK
        path: bin/*.apk
        
